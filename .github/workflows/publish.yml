# "v*" etiketi atıldığında (ör. v2.0.1) paketi derler, test eder ve GitHub Packages'a yayınlar.
#   git tag v2.0.1 && git push origin v2.0.1
# Paket sürümü etiketten alınır (v2.0.1 -> 2.0.1); csproj'daki <Version> etiketle ezilir.
name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: write    # GitHub Release oluşturmak için
  packages: write    # GitHub Packages'a yayınlamak için

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build
        run: dotnet build KpsV2.sln -c Release -p:Version=$VERSION

      - name: Unit tests
        run: dotnet test tests/KpsV2.Client.Tests -c Release --no-build

      - name: Pack
        run: dotnet pack src/KpsV2.Client -c Release --no-build -p:Version=$VERSION -o nupkg

      - name: Push to GitHub Packages
        run: >
          dotnet nuget push "nupkg/*.nupkg"
          --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          --api-key "${{ secrets.GITHUB_TOKEN }}"
          --skip-duplicate

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" nupkg/*.nupkg nupkg/*.snupkg --title "KpsV2.Client $VERSION" --generate-notes
