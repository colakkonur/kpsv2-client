# Yeni sürüm: git tag v2.0.2 && git push origin v2.0.2
# Paketi test eder, nuget.org'a yayınlar ve GitHub'da sürüm notlarıyla bir Release oluşturur.
# Paket yalnızca nuget.org'dan dağıtılır.
# Sürüm numarası etiketten alınır (v2.0.2 -> 2.0.2).
# nuget.org girişi API anahtarsız yapılır (Trusted Publishing); bu dosyanın adı nuget.org'daki politikayla aynı olmalı.
name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # GitHub Release
  id-token: write   # nuget.org Trusted Publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test KpsV2.sln -c Release

      - name: Pack
        run: dotnet pack src/KpsV2.Client -c Release -o nupkg -p:Version=${GITHUB_REF_NAME#v}

      - name: nuget.org login
        id: login
        uses: NuGet/login@v1
        with:
          user: colakkonur

      - name: Push to nuget.org
        run: dotnet nuget push nupkg/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --skip-duplicate

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
