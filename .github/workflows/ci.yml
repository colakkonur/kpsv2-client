# Her push ve pull request'te: derle + birim testleri (KPS sunucularına gitmez).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore KpsV2.sln

      - name: Build
        run: dotnet build KpsV2.sln -c Release --no-restore

      - name: Unit tests
        run: dotnet test tests/KpsV2.Client.Tests -c Release --no-build --logger "console;verbosity=normal"

      - name: Pack (doğrulama)
        run: dotnet pack src/KpsV2.Client -c Release --no-build -o nupkg
